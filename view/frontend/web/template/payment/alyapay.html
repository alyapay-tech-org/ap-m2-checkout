<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod">
        <label class="label" data-bind="attr: {'for': getCode()}">
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>
    <div class="payment-method-content" data-bind="visible: isChecked">
        <!-- ko if: isWidgetEnabled() -->
        <div class="alyapay-widget">
            <alya-placement data-bind="attr: {
                key: 'checkout',
                price: getWidgetPrice(),
                currency: getWidgetCurrency(),
                theme: getWidgetTheme(),
                variant: getWidgetVariant(),
                detail: getWidgetDetail(),
                'logo-position': getWidgetLogoPosition(),
                lang: getWidgetLang(),
                installments: '4'
            }"></alya-placement>
        </div>
        <!-- /ko -->

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="button"
                        data-bind="
                            click: placeOrder,
                            attr: { title: $t('Place Order') },
                            enable: isPlaceOrderActionAllowed()
                        ">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
